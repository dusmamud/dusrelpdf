name: Website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  website:
    name: Astro Starlight build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The site's prebuild step runs wasm-pack (build-wasm.mjs), so
      # the Rust toolchain + wasm-pack are needed here too.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: install
        working-directory: website
        run: npm ci
      - name: build
        working-directory: website
        run: npm run build
      - name: check pages
        working-directory: website
        run: |
          test -f dist/index.html
          test -f dist/sitemap-index.xml
          test -f dist/playground/index.html
          test -f dist/changelog/index.html
          test -f dist/reference/merge/index.html
          echo "website pages OK"
      # Deploy to Cloudflare Pages. This step is deliberately gated on
      # the secrets: until the repo owner creates the 'dusrelpdf' Pages
      # project and adds CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID,
      # the step is skipped and the workflow still passes on the build
      # + page checks above. (A step-level `if` on the secrets keeps
      # the deploy in the same job, so no artifact upload/download is
      # needed — dist/ is already on this runner.)
      - name: deploy to Cloudflare Pages
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=dusrelpdf
          workingDirectory: website
      - name: note deploy skipped (Cloudflare secrets not set yet)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' || secrets.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "::notice::Cloudflare Pages deploy skipped — CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set yet. Create the 'dusrelpdf' Pages project and add both secrets; the site build and page checks above still ran."
