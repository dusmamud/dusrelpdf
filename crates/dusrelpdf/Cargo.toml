[package]
name = "dusrelpdf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Offline PDF toolkit — merge, split, extract, reorder, rotate, watermark, page numbers, images-to-PDF and signature-image placement. One Rust core, no network."
readme = "../../README.md"
keywords = ["pdf", "merge", "split", "watermark", "cli"]
categories = ["command-line-utilities", "multimedia"]

[lib]
name = "dusrelpdf"
path = "src/lib.rs"

[dependencies]
lopdf.workspace = true
image = "0.25"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
image = "0.25"
